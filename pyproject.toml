[project]
name = "claude-log-analyzer"
version = "0.1.0"
description = "Local analysis of Claude Code session logs: token attribution, harness inspection, data exposure audit"
requires-python = ">=3.11"
dependencies = ["pandas"]

[project.optional-dependencies]
dev = ["pytest"]
plots = ["matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
